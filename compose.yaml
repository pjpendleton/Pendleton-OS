services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: pendleton_os
      POSTGRES_USER: pendleton
      POSTGRES_PASSWORD: pendleton
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pendleton -d pendleton_os']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pendleton-postgres:/var/lib/postgresql/data

volumes:
  pendleton-postgres:
